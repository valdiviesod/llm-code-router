name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/v4ld1 --ignore-missing-imports

      # Provider tests are excluded by addopts: CI has no agent CLIs and must
      # never depend on someone's quota to go green.
      - name: Test
        run: pytest -q

      - name: Console command is installed
        run: router --help
